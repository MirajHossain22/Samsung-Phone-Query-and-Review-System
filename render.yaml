services:
  - type: web
    name: samsung-phone-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m samsung_assistant.seed
    startCommand: uvicorn samsung_assistant.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BACKEND
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
